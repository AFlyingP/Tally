name: ci

on:
  push:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: check
        run: sh task.sh check
      - name: mutation
        run: sh task.sh mutation
      - name: reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports
          path: |
            **/build/reports/**
            proof/build/failures/**
          retention-days: 7
