name: tally

x-service: &service
  restart: "no"
  env_file: .env
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$${SERVER_PORT}/ready"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 10s

services:
  postgres:
    image: postgres:16.15-alpine
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_DB: tally
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD}
      LEDGER_APP_PASSWORD: ${LEDGER_APP_PASSWORD}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      EXTBANK_DB_PASSWORD: ${EXTBANK_DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - tally_pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tally"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.2.2
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports: ["29092:29092"]
    volumes:
      - tally_kafka:/var/lib/kafka/data
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  auth:
    <<: *service
    image: tally/auth:dev
    environment:
      SERVER_PORT: 8081
      TALLY_DB_USER: auth_app
      TALLY_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 512m

  extbank:
    <<: *service
    image: tally/extbank:dev
    environment:
      SERVER_PORT: 8083
      TALLY_DB_USER: extbank_app
      TALLY_DB_PASSWORD: ${EXTBANK_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx192m
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 384m

  ledger:
    <<: *service
    image: tally/ledger:dev
    environment:
      SERVER_PORT: 8080
      TALLY_LEDGER_ROLES: api
      TALLY_LEDGER_STRATEGY: ${TALLY_LEDGER_STRATEGY:-pessimistic}
      TALLY_DB_USER: ledger_app
      TALLY_DB_PASSWORD: ${LEDGER_APP_PASSWORD}
      TALLY_DB_OWNER_USER: ledger_owner
      TALLY_DB_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx640m
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_healthy }
    mem_limit: 1024m

  ledger-worker:
    <<: *service
    image: tally/ledger:dev
    environment:
      SERVER_PORT: 8084
      TALLY_LEDGER_ROLES: scheduler,orchestrator,relay,expiry,recon,sealer
      TALLY_LEDGER_STRATEGY: ${TALLY_LEDGER_STRATEGY:-pessimistic}
      TALLY_DB_USER: ledger_app
      TALLY_DB_PASSWORD: ${LEDGER_APP_PASSWORD}
      TALLY_DB_OWNER_USER: ledger_owner
      TALLY_DB_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD}
      TALLY_DB_POOL_SIZE: 16
      JAVA_TOOL_OPTIONS: -Xmx448m
    ports: ["8084:8084"]
    depends_on:
      ledger: { condition: service_healthy }
      kafka: { condition: service_healthy }
      extbank: { condition: service_healthy }
    mem_limit: 768m

  monitor:
    <<: *service
    image: tally/monitor:dev
    environment:
      SERVER_PORT: 8082
      TALLY_DB_USER: monitor_app
      TALLY_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx288m
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      auth: { condition: service_healthy }
    mem_limit: 512m

volumes:
  tally_pg:
  tally_kafka:
  tally_auth_keys:
