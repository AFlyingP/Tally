spring:
  application:
    name: monitor
  datasource:
    url: ${TALLY_DB_URL:jdbc:postgresql://postgres:5432/tally}
    username: ${TALLY_DB_USER:monitor_app}
    password: ${TALLY_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${TALLY_DB_POOL_SIZE:8}
      connection-timeout: 5000
  flyway:
    user: ${TALLY_DB_OWNER_USER:${spring.datasource.username}}
    password: ${TALLY_DB_OWNER_PASSWORD:${spring.datasource.password}}
    locations: classpath:db/monitor
    default-schema: monitor
    schemas: monitor
    create-schemas: false

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: monitor
  level:
    tally: ${LOGGING_LEVEL_TALLY:INFO}

tally:
  auth:
    jwks-uri: ${TALLY_AUTH_JWKS_URI:http://auth:8081/oauth2/jwks}
    issuer: ${TALLY_AUTH_ISSUER:http://auth:8081}
  monitor:
    kafka:
      bootstrap: ${TALLY_KAFKA_BOOTSTRAP:kafka:9092}
      topic: ${TALLY_KAFKA_TOPIC:tally.transactions.v1}
      group: ${TALLY_KAFKA_GROUP:tally-monitor}
    r1:
      max-count: ${TALLY_R1_MAX_COUNT:10}
      window-seconds: ${TALLY_R1_WINDOW_SECONDS:600}
    r2:
      min-count: ${TALLY_R2_MIN_COUNT:3}
      window-seconds: ${TALLY_R2_WINDOW_SECONDS:86400}
      threshold: ${TALLY_R2_THRESHOLD:1000000}
      lower-percent: ${TALLY_R2_LOWER_PERCENT:90}
    r3:
      percent: ${TALLY_R3_PERCENT:90}
      window-seconds: ${TALLY_R3_WINDOW_SECONDS:1800}
    case-join-seconds: ${TALLY_CASE_JOIN_SECONDS:86400}
